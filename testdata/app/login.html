<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>login</title>
</head>
<body>
  <form id="login-form">
    <input data-testid="login-username" name="username">
    <input data-testid="login-password" name="password" type="password">
    <button data-testid="login-submit" type="submit">Login</button>
  </form>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.querySelector("[data-testid=login-username]").value;
      var p = document.querySelector("[data-testid=login-password]").value;
      if (u === "user1" && p === "password1") {
        location.href = "/home";
      }
    });
  </script>
</body>
</html>
