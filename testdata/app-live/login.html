<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>login</title>
</head>
<body>
  <header data-testid="header">
    <nav data-testid="header-nav">
      <a href="/" data-testid="header-nav-home">Home</a>
      <a href="/login" data-testid="header-nav-login">Login</a>
      <a href="/register" data-testid="header-nav-register">Register</a>
    </nav>
  </header>
  <h1 data-testid="login-form-title">Login Form</h1>
  <form id="login-form" data-testid="login-form">
    <input data-testid="login-input" name="username">
    <input data-testid="password-input" name="password" type="password">
    <p data-testid="error-message" hidden></p>
    <button data-testid="submit-button" type="submit">Login</button>
  </form>
  <p><a href="/register" data-testid="register-link">Register</a></p>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.querySelector("[data-testid=login-input]").value.trim();
      var p = document.querySelector("[data-testid=password-input]").value.trim();
      var err = document.querySelector("[data-testid=error-message]");
      function fail(msg) {
        err.hidden = false;
        err.textContent = msg;
      }
      if (!u && !p) {
        fail("Login and password are required (minimum 3 and 6 characters)");
        return;
      }
      if (!u) {
        fail("Login is required (minimum 3 characters)");
        return;
      }
      if (u.length < 3) {
        fail("Login must be at least 3 characters");
        return;
      }
      if (!p) {
        fail("Password is required (minimum 6 characters)");
        return;
      }
      if (p.length < 6) {
        fail("Password must be at least 6 characters");
        return;
      }
      if (u === "user1" && p === "password1") {
        location.href = "/home";
        return;
      }
      fail("Wrong login or password");
    });
  </script>
</body>
</html>
