<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>home</title>
</head>
<body>
  <header data-testid="header">
    <nav data-testid="header-nav">
      <a href="/" data-testid="header-nav-home">Home</a>
      <a href="/login" data-testid="header-nav-login">Login</a>
      <a href="/register" data-testid="header-nav-register">Register</a>
    </nav>
  </header>
  <main data-testid="multistack-layout">
    <p data-testid="welcome-message">Welcome, user1!</p>
    <button type="button" data-testid="delete-account-button">Delete account</button>
    <p data-testid="health-status">→ UP | service: backend-java-spring | frontend: frontend-typescript-react</p>
    <div data-testid="items-list">
      <p>Alpha</p>
    </div>
  </main>
  <script>
    var user = new URLSearchParams(location.search).get("user");
    if (user) {
      document.querySelector("[data-testid=welcome-message]").textContent =
        "Welcome, " + user + "!";
    }
    document.querySelector("[data-testid=delete-account-button]").addEventListener("click", function () {
      location.href = "/login";
    });
  </script>
</body>
</html>
